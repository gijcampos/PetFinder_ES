<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetFinder | Cadastro de tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #033960;
      --cartao: #9D7680;
      --campo: #d9d9d9;
      --branco: #ffffff;
      --verde: #2e8b1f;
      --vermelho: #cc0000;
      --fonte-titulo: "Montserrat", sans-serif;
      --fonte-texto: "Quicksand", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--fonte-texto);
      background: var(--azul);
      color: var(--branco);
    }

    .topo {
      padding: 16px 40px;
      background-color: var(--branco);
      background-image: url("pagina-patinhas-clara.png");
      background-size: cover;    
    }

    .logo { display: block; height: 130px; width: auto; }

    .pagina { flex: 1; padding: 16px; display: flex; justify-content: center; }

    .cartao {
      width: 100%;
      max-width: 1130px;
      align-self: flex-start;
      padding: 24px 28px 20px;
      background: var(--cartao);
      border-radius: 28px;
    }

    h1 { font: 400 clamp(2rem, 5vw, 3.4rem)/1.1 var(--fonte-titulo); }
    .subtitulo { margin: 4px 0 18px; font-weight: 700; font-size: 1.1rem; }

    .grupo { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; font-size: 1.15rem; font-weight: 500; }

    .entrada {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      font: 400 1.1rem var(--fonte-titulo);
      color: #000;
      background: var(--campo);
      border: 3px solid transparent;
      border-radius: 6px;
    }
    .entrada.invalido { border-color: #d40000; }
    .entrada:focus-visible { outline: 3px solid var(--branco); outline-offset: 2px; }

    .erro-campo { min-height: 1.1em; margin-top: 3px; font-size: 0.8rem; }
    .erro-campo a { color: #8ec5ff; font-weight: 700; }

    .rodape-form {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      margin-top: 8px;
    }
    .obrigatorio { position: absolute; left: 0; bottom: 0; font-size: 0.95rem; }
    .botoes { display: flex; gap: 36px; }

    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 152px;
      height: 40px;
      padding: 0 20px;
      font: 500 1rem var(--fonte-titulo);
      color: var(--branco);
      text-decoration: none;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }
    .botao.verde { background: var(--verde); }
    .botao.vermelho { background: var(--vermelho); }
    .botao:hover { filter: brightness(0.9); }
    .botao:focus-visible { outline: 3px solid var(--branco); outline-offset: 3px; }

    /* Modal de sucesso */
    .fundo-modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(255, 120, 120, 0.45);
    }
    .fundo-modal[hidden] { display: none; }
    .modal {
      position: relative;
      width: min(460px, 100%);
      padding: 28px 24px 32px;
      text-align: center;
      color: #000;
      background: var(--branco);
      border: 1px solid #000;
      border-radius: 40px;
    }
    .modal h2 { font: 400 2.2rem var(--fonte-titulo); }
    .modal p { margin-top: 6px; font: 400 1.9rem/1.2 var(--fonte-titulo); }
    .fechar {
      position: absolute;
      top: 8px;
      right: 12px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      font: 400 1.6rem var(--fonte-titulo);
      color: var(--branco);
      text-decoration: none;
      background: #b52a2a;
      border: 1px solid #000;
      border-radius: 50%;
    }

    @media (max-width: 640px) {
      .botoes { gap: 12px; }
      .botao { min-width: 120px; }
      .rodape-form { flex-direction: column; gap: 10px; }
      .obrigatorio { position: static; align-self: flex-start; }
      .logo { height: 90px; }
    }
  </style>
</head>
<body>
  <header class="topo">
    <img class="logo" src="PetFinder-Logo.png" alt="PetFinder - Coleira inteligente"
         onerror="this.style.display='none'">
  </header>

  <main class="pagina">
    <section class="cartao" aria-labelledby="titulo">
      <h1 id="titulo">CADASTRO DE TUTOR</h1>
      <p class="subtitulo">Crie sua conta de tutor para monitorar e cuidar do seu pet.</p>

      <form id="form-cadastro" method="post" action="" novalidate>
        <!-- BACK: incluir {% csrf_token %} aqui ao integrar com o Django -->

        <div class="grupo">
          <label for="nome">Nome completo:*</label>
          <input class="entrada" type="text" id="nome" name="nome"
                 autocomplete="name" required aria-describedby="erro-nome">
          <p class="erro-campo" id="erro-nome" role="alert"></p>
        </div>

        <div class="grupo">
          <label for="email">E-mail:*</label>
          <input class="entrada" type="email" id="email" name="email"
                 autocomplete="email" required aria-describedby="erro-email">
          <p class="erro-campo" id="erro-email" role="alert"></p>
        </div>

        <div class="grupo">
          <label for="telefone">Telefone de contato:*</label>
          <input class="entrada" type="tel" id="telefone" name="telefone"
                 placeholder="(44) 99999-9999" inputmode="numeric" maxlength="15"
                 autocomplete="tel" required aria-describedby="erro-telefone">
          <p class="erro-campo" id="erro-telefone" role="alert"></p>
        </div>

        <div class="grupo">
          <label for="senha">Senha (8 caracteres):*</label>
          <input class="entrada" type="password" id="senha" name="senha"
                 placeholder="Mínimo de 8 caracteres"
                 autocomplete="new-password" required aria-describedby="erro-senha">
          <p class="erro-campo" id="erro-senha" role="alert"></p>
        </div>

        <div class="rodape-form">
          <p class="obrigatorio">*Campos obrigatórios</p>
          <div class="botoes">
            <a class="botao vermelho" href="tela_login.html">Cancelar</a>
            <button class="botao verde" type="submit">Salvar</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <!-- Modal de sucesso (tela 1.1 do Figma) -->
  <div class="fundo-modal" id="modal-sucesso" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <a class="fechar" href="tela_login.html" aria-label="Fechar e ir para o login">X</a>
      <h2 id="modal-titulo">Parabéns!</h2>
      <p>Cadastro realizado com sucesso!</p>
    </div>
  </div>

  <script src="cadastro_de_tutor/demo.js"></script>
  <script>
    const form = document.getElementById("form-cadastro");
    const modal = document.getElementById("modal-sucesso");

    // Mostra ou limpa o erro de um campo (borda vermelha + mensagem)
    function erro(id, mensagem) {
      const campo = document.getElementById(id);
      const texto = document.getElementById("erro-" + id);
      campo.classList.toggle("invalido", Boolean(mensagem));
      campo.setAttribute("aria-invalid", mensagem ? "true" : "false");
      if (mensagem === "email-duplicado") {
        // Tela 1.2 do Figma
        texto.innerHTML = 'Este e-mail já está cadastrado. <a href="tela_login.html">Entrar</a> ou <a href="#">recuperar senha.</a>';
      } else {
        texto.textContent = mensagem || "";
      }
    }

    // Máscara do telefone: (44) 99999-9999
    const telefone = document.getElementById("telefone");
    telefone.addEventListener("input", () => {
      const d = telefone.value.replace(/\D/g, "").slice(0, 11);
      let r = d;
      if (d.length > 7) r = `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
      else if (d.length > 2) r = `(${d.slice(0, 2)}) ${d.slice(2)}`;
      else if (d.length > 0) r = `(${d}`;
      telefone.value = r;
    });

    form.addEventListener("submit", (e) => {
      const nome = form.nome.value.trim();
      const email = form.email.value.trim();
      const digitos = form.telefone.value.replace(/\D/g, "");
      const senha = form.senha.value;
      let valido = true;

      erro("nome", nome ? "" : "Informe o nome completo.");
      if (!nome) valido = false;

      if (!email) { erro("email", "Informe o e-mail."); valido = false; }
      else if (!/^\S+@\S+\.\S+$/.test(email)) { erro("email", "Digite um e-mail válido."); valido = false; }
      else if (Demo.emailExiste(email)) { erro("email", "email-duplicado"); valido = false; }
      else erro("email", "");

      if (digitos.length !== 11) { erro("telefone", "Informe o telefone com DDD: (44) 99999-9999."); valido = false; }
      else erro("telefone", "");

      if (!senha) { erro("senha", "Informe a senha."); valido = false; }
      else if (senha.length < 8) { erro("senha", "A senha não atende aos requisitos."); valido = false; }
      else erro("senha", "");

      if (!valido) { e.preventDefault(); return; }

      // BACK: ao integrar, o servidor salva o tutor e depois mostra o modal.
      e.preventDefault();
      Demo.adicionar({ nome, email, telefone: form.telefone.value, senha });
      modal.hidden = false;
    });
  </script>
</body>
</html>
