<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetFinder | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #033960;
      --rosa: #d18a8a;
      --rosa-pata: #e8c3bf;
      --branco: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family: "Inter", sans-serif;
      color: var(--azul);
      background-color: var(--branco);background-image: url("pagina-patinhas.png");
      background-size: cover;
    }

    .login {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      display: block;
      width: clamp(300px, 85vw, 800px);
      height: auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    form {
      width: 100%;
      max-width: 440px;
      margin-top: -70px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .campo {
      width: 100%;
      height: 52px;
      padding: 0 24px;
      font: inherit;
      font-size: 1.05rem;
      color: var(--branco);
      background: var(--azul);
      border: 2px solid var(--azul);
      border-radius: 999px;
    }
    .campo::placeholder { color: rgba(255, 255, 255, 0.75); }
    .campo:-webkit-autofill {
      -webkit-text-fill-color: var(--branco);
      -webkit-box-shadow: 0 0 0 100px var(--azul) inset;
      caret-color: var(--branco);
    }

    .campo:focus-visible,
    .botao:focus-visible,
    .cadastro:focus-visible {
      outline: 3px solid var(--rosa);
      outline-offset: 3px;
    }

    .botao {
      height: 68px;
      font: inherit;
      font-size: 1.6rem;
      color: var(--branco);
      background: var(--azul);
      border: 2px solid var(--azul);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .botao:hover { background: #022a47; }

    .erro {
      min-height: 1.2em;
      font-size: 0.95rem;
      color: #b3262d;
    }

    .cadastro {
      margin-top: 14px;
      font-size: 1rem;
      color: var(--azul);
    }
  </style>
</head>
<body>
  <main class="login">
    <h1 class="sr-only">PetFinder - Coleira inteligente</h1>
    <img class="logo" src="PetFinder-Logo.png" alt="PetFinder - Coleira inteligente"
         onerror="this.style.display='none'">

    <form id="form-login" novalidate>
      <input class="campo" type="email" id="email" name="email"
             placeholder="E-mail" autocomplete="email" aria-label="E-mail" required>
      <input class="campo" type="password" id="senha" name="senha"
             placeholder="Senha" autocomplete="current-password" aria-label="Senha" required>
      <p class="erro" id="erro" role="alert"></p>
      <button class="botao" type="submit">Login</button>
    </form>

    <a class="cadastro" href="cadastro_de_tutor.html">Novo cadastro</a>
  </main>

    <script src="cadastro_de_tutor/demo.js"></script>
  <script>
    const form = document.getElementById("form-login");
    const erro = document.getElementById("erro");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const senha = form.senha.value;

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        erro.textContent = "Digite um e-mail válido.";
        form.email.focus();
        return;
      }
        if (senha.length < 8) {
        erro.textContent = "A senha precisa ter pelo menos 8 caracteres.";
        form.senha.focus();
        return;
      }

      // DEMONSTRAÇÃO: o back confere e-mail e senha no banco.
      const achou = Demo.listar().some(
        (t) => t.email.toLowerCase() === email.toLowerCase() && t.senha === senha
      );
      if (!achou) {
        erro.textContent = "E-mail ou senha incorretos.";
        return;
      }

      erro.textContent = "";
      window.location.href = "lista_tutores.html";
    });
  </script>
</body>
</html>
